<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeTutor - Professor de Lógica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #1e1e2e; 
      color: #cdd6f4;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      background: #313244;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 800px;
    }
    h1 {
      color: #89b4fa; 
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      color: #a6adc8;
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    textarea { 
      width: 100%; 
      height: 100px; 
      padding: 16px;
      font-size: 16px;
      font-family: 'Courier New', Courier, monospace;
      background-color: #181825;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 8px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #89b4fa; }
    button { 
      padding: 14px 24px; 
      font-size: 16px; 
      font-weight: bold;
      cursor: pointer; 
      background-color: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 8px;
      margin-top: 16px;
      transition: background 0.2s;
    }
    button:hover { background-color: #74c7ec; }
    button:disabled { background-color: #45475a; cursor: not-allowed; }
    .resultado-box {
      margin-top: 30px;
      display: none;
    }
    h2 {
      color: #a6e3a1; 
      font-size: 20px;
      margin-bottom: 15px;
    }
    pre { 
      white-space: pre-wrap; 
      background: #11111b; 
      padding: 20px; 
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      color: #cdd6f4;
      line-height: 1.6;
      border-left: 4px solid #89b4fa;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CodeTutor - Seu Professor de Lógica</h1>
    <p>Digite um conceito de programação que você não entendeu ou uma dúvida de código. O professor vai te explicar de forma didática, com exemplos e exercícios.</p>

    <textarea id="prompt" placeholder="Ex.: O que é um loop 'for' e quando devo usar ele em vez de 'while'?"></textarea>

    <button id="btn-enviar" onclick="enviar()">Tirar Dúvida</button>

    <div class="resultado-box" id="resultado-box">
      <h2>Explicação do Professor</h2>
      <pre id="resposta"></pre>
    </div>
  </div>

  <script>
    async function enviar() {
      const prompt = document.getElementById("prompt").value;
      const outputBox = document.getElementById("resultado-box");
      const output = document.getElementById("resposta");
      const btn = document.getElementById("btn-enviar");

      if(!prompt.trim()) return;

      btn.disabled = true;
      btn.textContent = "Professor está digitando...";
      outputBox.style.display = "block";
      output.textContent = "Processando sua dúvida...";

      try {
        const response = await fetch("/api/llm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (!response.ok) {
          output.textContent = data.erro || "Erro desconhecido.";
        } else {
          output.textContent = data.resposta;
        }
      } catch (error) {
        output.textContent = "Erro ao conectar com a API local.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Tirar Dúvida";
      }
    }
  </script>
</body>
</html>
